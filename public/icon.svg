<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Charcoal Background -->
  <rect width="512" height="512" rx="115" fill="#0a0a0a" />
  <rect width="512" height="512" rx="115" fill="url(#ambientGlow)" />

  <!-- Subtle Warm Glass Inner Border -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="96"
    fill="none"
    stroke="url(#amberGrad)"
    stroke-width="2"
    stroke-opacity="0.22"
  />

  <!-- Sleek Minimalist Monogram Letter "E" -->
  <g filter="url(#softGlow)">
    <path
      d="M176 140 H344 C355.046 140 364 148.954 364 160 C364 171.046 355.046 180 344 180 H216 V236 H316 C327.046 236 336 244.954 336 256 C336 267.046 327.046 276 316 276 H216 V332 H344 C355.046 332 364 340.954 364 352 C364 363.046 355.046 372 344 372 H176 C164.954 372 156 363.046 156 352 V160 C156 148.954 164.954 140 176 140 Z"
      fill="url(#amberGrad)"
    />
    <!-- Subtle Accent SparkDot -->
    <circle cx="364" cy="256" r="10" fill="url(#amberGrad)" opacity="0.85" />
  </g>
</svg>
